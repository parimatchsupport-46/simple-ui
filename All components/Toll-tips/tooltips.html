<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tooltips</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      --accent: #4f6bed;
    }
    [data-theme="dark"] {
      --bg: #12141a;
      --card: #1c1f28;
      --text: #eceef3;
      --muted: #9aa1b2;
      --border: #2a2e3a;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      --accent: #7b92ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 80px 16px 40px;
      transition: background 0.3s, color 0.3s;
    }
    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 46px;
      height: 46px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.2s, background 0.3s;
    }
    .theme-toggle:hover { transform: scale(1.08); }
    .theme-toggle svg { width: 22px; height: 22px; }
    .theme-toggle .icon-sun { display: none; }
    [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
    [data-theme="dark"] .theme-toggle .icon-moon { display: none; }
    .group { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
    .tooltip-wrapper {
      position: relative;
      display: inline-block;
    }
    .tooltip-btn {
      padding: 10px 16px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .tooltip-btn:hover { border-color: var(--accent); }
    .tooltip-text {
      position: absolute;
      bottom: 120%;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: var(--card);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
      pointer-events: none;
    }
    .tooltip-text::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: var(--text);
    }
    .tooltip-wrapper:hover .tooltip-text {
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  </button>

  <div class="group">
    <div class="tooltip-wrapper">
      <button class="tooltip-btn">Hover Me 1</button>
      <span class="tooltip-text">Ye ek tooltip hai!</span>
    </div>
    <div class="tooltip-wrapper">
      <button class="tooltip-btn">Hover Me 2</button>
      <span class="tooltip-text">Helpful information</span>
    </div>
    <div class="tooltip-wrapper">
      <button class="tooltip-btn">Hover Me 3</button>
      <span class="tooltip-text">More details here</span>
    </div>
  </div>

  <script>
    const root = document.documentElement;
    const toggle = document.getElementById("themeToggle");
    function setTheme(theme) {
      root.setAttribute("data-theme", theme);
      try { localStorage.setItem("theme", theme); } catch (e) {}
    }
    let saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) {}
    setTheme(saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
    toggle.addEventListener("click", () => {
      setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });
  </script>
</body>
</html>
