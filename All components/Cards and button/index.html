<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Page</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      --accent: #4f6bed;
      --yes: #22a06b;
      --no: #e5484d;
    }

    [data-theme="dark"] {
      --bg: #12141a;
      --card: #1c1f28;
      --text: #eceef3;
      --muted: #9aa1b2;
      --border: #2a2e3a;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      --accent: #7b92ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 80px 16px 40px;
      transition: background 0.3s, color 0.3s;
    }

    /* Theme switch (top right) */
    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 46px;
      height: 46px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.2s, background 0.3s;
    }
    .theme-toggle:hover { transform: scale(1.08); }
    .theme-toggle svg { width: 22px; height: 22px; }
    .theme-toggle .icon-sun { display: none; }
    [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
    [data-theme="dark"] .theme-toggle .icon-moon { display: none; }

    /* Cards */
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: var(--shadow);
      padding: 32px 28px;
      text-align: center;
      transition: background 0.3s, border-color 0.3s;
    }

    .card h1 { font-size: 1.4rem; margin-bottom: 8px; }
    .card p { color: var(--muted); font-size: 0.95rem; }

    .question { margin-bottom: 20px; }

    .buttons {
      display: flex;
      gap: 14px;
      justify-content: center;
    }

    .btn {
      flex: 1;
      padding: 12px 0;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    .btn.yes { background: var(--yes); }
    .btn.no { background: var(--no); }

    #result {
      margin-top: 16px;
      min-height: 1.2em;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
    <!-- Moon icon (shown in light mode) -->
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
    <!-- Sun icon (shown in dark mode) -->
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
  </button>

  <!-- Center card -->
  <div class="card">
    <h1>Welcome</h1>
    <p>Ye ek simple card hai, subtle shape ke saath.</p>
  </div>

  <!-- Card with Yes / No buttons -->
  <div class="card">
    <h1>Ek sawaal</h1>
    <p class="question">Kya aapko ye page pasand aaya?</p>
    <div class="buttons">
      <button class="btn yes" id="yesBtn">Yes</button>
      <button class="btn no" id="noBtn">No</button>
    </div>
    <div id="result"></div>
  </div>

  <script>
    const root = document.documentElement;
    const toggle = document.getElementById("themeToggle");

    function setTheme(theme) {
      root.setAttribute("data-theme", theme);
      try { localStorage.setItem("theme", theme); } catch (e) {}
    }

    let saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) {}
    setTheme(saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

    toggle.addEventListener("click", () => {
      setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    const result = document.getElementById("result");
    document.getElementById("yesBtn").addEventListener("click", () => result.textContent = "You clicked Yes ✅");
    document.getElementById("noBtn").addEventListener("click", () => result.textContent = "You clicked No ❌");
  </script>
</body>
</html>
