<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modals / Popups</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      --accent: #4f6bed;
    }
    [data-theme="dark"] {
      --bg: #12141a;
      --card: #1c1f28;
      --text: #eceef3;
      --muted: #9aa1b2;
      --border: #2a2e3a;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      --accent: #7b92ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 80px 16px 40px;
      transition: background 0.3s, color 0.3s;
    }
    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 46px;
      height: 46px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.2s, background 0.3s;
      z-index: 5;
    }
    .theme-toggle:hover { transform: scale(1.08); }
    .theme-toggle svg { width: 22px; height: 22px; }
    .theme-toggle .icon-sun { display: none; }
    [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
    [data-theme="dark"] .theme-toggle .icon-moon { display: none; }
    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal-content {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 32px;
      max-width: 400px;
      width: 100%;
      box-shadow: var(--shadow);
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header { margin-bottom: 16px; }
    .modal-header h2 { margin-bottom: 8px; }
    .modal-body { margin-bottom: 20px; color: var(--muted); }
    .modal-footer { display: flex; gap: 12px; justify-content: flex-end; }
    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--bg); }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  </button>

  <button class="btn" id="openModal">Modal kholo</button>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Confirmation</h2>
      </div>
      <div class="modal-body">
        Kya aap sure ho? Ye action confirm karoge?
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="closeModal">Cancel</button>
        <button class="btn" id="confirmModal">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    const root = document.documentElement;
    const toggle = document.getElementById("themeToggle");
    function setTheme(theme) {
      root.setAttribute("data-theme", theme);
      try { localStorage.setItem("theme", theme); } catch (e) {}
    }
    let saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) {}
    setTheme(saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
    toggle.addEventListener("click", () => {
      setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    const modalOverlay = document.getElementById("modalOverlay");
    const openBtn = document.getElementById("openModal");
    const closeBtn = document.getElementById("closeModal");
    const confirmBtn = document.getElementById("confirmModal");

    openBtn.addEventListener("click", () => modalOverlay.classList.add("open"));
    closeBtn.addEventListener("click", () => modalOverlay.classList.remove("open"));
    confirmBtn.addEventListener("click", () => {
      alert("Confirmed!");
      modalOverlay.classList.remove("open");
    });
    modalOverlay.addEventListener("click", (e) => {
      if (e.target === modalOverlay) modalOverlay.classList.remove("open");
    });
  </script>
</body>
</html>
