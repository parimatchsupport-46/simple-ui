
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Data Table</title>

  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #6b7280;
      --border: #e5e7eb;
      --header: #f8f9fb;
      --hover: #f7f8fa;
      --shadow: 0 8px 30px rgba(0,0,0,0.06);
      --accent: #4f6bed;
      --success-bg: rgba(34,160,107,0.12);
      --success: #22a06b;
      --inactive-bg: rgba(107,114,128,0.12);
      --inactive: #6b7280;
    }

    [data-theme="dark"] {
      --bg: #12141a;
      --card: #1c1f28;
      --text: #eceef3;
      --muted: #9aa1b2;
      --border: #2a2e3a;
      --header: #222530;
      --hover: #252936;
      --shadow: 0 8px 30px rgba(0,0,0,0.3);
      --accent: #7b92ff;
      --success-bg: rgba(34,160,107,0.16);
      --success: #43c994;
      --inactive-bg: rgba(154,161,178,0.12);
      --inactive: #a6adbc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 0 40px;
      transition: background 0.3s, color 0.3s;
    }

    /* Theme Toggle */

    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 46px;
      height: 46px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.2s, background 0.3s;
      z-index: 10;
    }

    .theme-toggle:hover {
      transform: scale(1.06);
    }

    .theme-toggle svg {
      width: 22px;
      height: 22px;
    }

    .theme-toggle .icon-sun {
      display: none;
    }

    [data-theme="dark"] .theme-toggle .icon-sun {
      display: block;
    }

    [data-theme="dark"] .theme-toggle .icon-moon {
      display: none;
    }

    /* Table Container */

    .table-container {
      width: 90%;
      max-width: 1000px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: background 0.3s, border 0.3s;
    }

    /* Responsive Wrapper */

    .table-scroll {
      width: 100%;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--muted) transparent;
    }

    table {
      width: 100%;
      min-width: 480px;
      border-collapse: collapse;
      text-align: left;
    }

    /* Table Header */

    thead {
      background: var(--header);
    }

    th {
      padding: 15px 20px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 650;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }

    /* Table Body */

    td {
      padding: 15px 20px;
      font-size: 0.9rem;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      transition: background 0.2s;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr {
      transition: background 0.2s;
    }

    tbody tr:hover {
      background: var(--hover);
    }

    /* Name */

    .user-name {
      font-weight: 600;
      color: var(--text);
    }

    /* Email */

    .user-email {
      color: var(--muted);
    }

    /* Status Badges */

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.76rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status.active {
      background: var(--success-bg);
      color: var(--success);
    }

    .status.active .status-dot {
      background: var(--success);
    }

    .status.inactive {
      background: var(--inactive-bg);
      color: var(--inactive);
    }

    .status.inactive .status-dot {
      background: var(--inactive);
    }

    /* Mobile Responsive */

    @media (max-width: 480px) {
      .table-container {
        width: 90%;
        border-radius: 10px;
      }

      th {
        padding: 13px 14px;
        font-size: 0.73rem;
      }

      td {
        padding: 14px;
        font-size: 0.84rem;
      }

      .status {
        padding: 5px 8px;
        font-size: 0.72rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

  
    /* ==========================================================================
       ADDED THEMES  (new colour schemes - Green / Blue / Sky Blue /
       Dark + White / White + Dark).  Every scheme supports BOTH light and
       dark mode.  Nothing above this line has been changed or removed:
       the original :root (light) and [data-theme="dark"] rules are intact.

       data-theme  = mode   ("light" | "dark")   <- unchanged, existing
       data-scheme = colour (green|blue|sky|darkwhite|whitedark)  <- new
       ========================================================================== */

    /* --- Green theme : LIGHT mode --- */
    html[data-scheme="green"] {
      --bg:#f0f7f2; --card:#ffffff; --text:#14251b; --muted:#5b7264; --border:#d7e8dd; --shadow:0 8px 30px rgba(20,74,42,.10); --accent:#1f9d55;
    }

    /* --- Green theme : DARK mode --- */
    html[data-theme="dark"][data-scheme="green"] {
      --bg:#0d1511; --card:#15211a; --text:#e7f3ec; --muted:#93a99b; --border:#23362b; --shadow:0 8px 30px rgba(0,0,0,.45); --accent:#4ade80;
    }

    /* --- Blue theme : LIGHT mode --- */
    html[data-scheme="blue"] {
      --bg:#f0f4fb; --card:#ffffff; --text:#131c2e; --muted:#5b6a83; --border:#d9e2f0; --shadow:0 8px 30px rgba(20,50,110,.10); --accent:#2563eb;
    }

    /* --- Blue theme : DARK mode --- */
    html[data-theme="dark"][data-scheme="blue"] {
      --bg:#0b1120; --card:#131c2e; --text:#e7edf9; --muted:#92a0ba; --border:#22304c; --shadow:0 8px 30px rgba(0,0,0,.45); --accent:#60a5fa;
    }

    /* --- Sky Blue theme : LIGHT mode --- */
    html[data-scheme="sky"] {
      --bg:#eef7fc; --card:#ffffff; --text:#10242e; --muted:#587585; --border:#d4e9f4; --shadow:0 8px 30px rgba(14,90,130,.10); --accent:#0ea5e9;
    }

    /* --- Sky Blue theme : DARK mode --- */
    html[data-theme="dark"][data-scheme="sky"] {
      --bg:#09141b; --card:#10202a; --text:#e4f2f9; --muted:#8ea9b8; --border:#1d3543; --shadow:0 8px 30px rgba(0,0,0,.45); --accent:#38bdf8;
    }

    /* --- Dark + White theme : LIGHT mode --- */
    html[data-scheme="darkwhite"] {
      --bg:#f5f5f5; --card:#ffffff; --text:#0a0a0a; --muted:#4f4f4f; --border:#1a1a1a; --shadow:0 8px 30px rgba(0,0,0,.18); --accent:#0a0a0a;
    }

    /* --- Dark + White theme : DARK mode --- */
    html[data-theme="dark"][data-scheme="darkwhite"] {
      --bg:#0a0a0a; --card:#151515; --text:#ffffff; --muted:#a6a6a6; --border:#e8e8e8; --shadow:0 8px 30px rgba(0,0,0,.60); --accent:#ffffff;
    }

    /* --- White + Dark theme : LIGHT mode --- */
    html[data-scheme="whitedark"] {
      --bg:#f8fafc; --card:#ffffff; --text:#1e293b; --muted:#64748b; --border:#e2e8f0; --shadow:0 8px 24px rgba(30,41,59,.10); --accent:#334155;
    }

    /* --- White + Dark theme : DARK mode --- */
    html[data-theme="dark"][data-scheme="whitedark"] {
      --bg:#1e293b; --card:#2a3850; --text:#f8fafc; --muted:#a8b5c8; --border:#3e4f6b; --shadow:0 8px 30px rgba(0,0,0,.45); --accent:#f1f5f9;
    }

    /* ---------- Added: theme picker widget (new UI, bottom-left) ---------- */
    .st-dock {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 6;
      font-family: inherit;
    }
    .st-btn {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.2s, background 0.3s, border-color 0.3s;
    }
    .st-btn:hover { transform: scale(1.08); }
    .st-btn svg { width: 20px; height: 20px; }
    .st-panel {
      position: absolute;
      bottom: 52px;
      left: 0;
      width: 200px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: var(--shadow);
      padding: 12px;
      display: none;
    }
    .st-dock.open .st-panel { display: block; }
    .st-title {
      margin: 0 0 8px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .st-list { display: flex; flex-direction: column; gap: 3px; }
    .st-opt {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 7px 8px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .st-opt:hover { background: var(--bg); }
    .st-opt[aria-checked="true"] {
      border-color: var(--accent);
      background: var(--bg);
      font-weight: 600;
    }
    .st-sw {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid var(--border);
      flex: none;
    }
    .st-hint {
      margin: 9px 0 0;
      font-size: 0.68rem;
      line-height: 1.45;
      color: var(--muted);
    }
</style>
</head>

<body>

  <!-- Theme Toggle -->

  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">

    <svg class="icon-moon" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>

    <svg class="icon-sun" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l-1.41 1.41M17.66 6.34l1.41-1.41"/>
    </svg>

  </button>

  <!-- Data Table -->

  <div class="table-container">

    <div class="table-scroll">

      <table>

        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody>

          <tr>
            <td>
              <span class="user-name">John</span>
            </td>
            <td>
              <span class="user-email">john@example.com</span>
            </td>
            <td>
              <span class="status active">
                <span class="status-dot"></span>
                Active
              </span>
            </td>
          </tr>

          <tr>
            <td>
              <span class="user-name">Jane</span>
            </td>
            <td>
              <span class="user-email">jane@example.com</span>
            </td>
            <td>
              <span class="status active">
                <span class="status-dot"></span>
                Active
              </span>
            </td>
          </tr>

          <tr>
            <td>
              <span class="user-name">Bob</span>
            </td>
            <td>
              <span class="user-email">bob@example.com</span>
            </td>
            <td>
              <span class="status inactive">
                <span class="status-dot"></span>
                Inactive
              </span>
            </td>
          </tr>

          <tr>
            <td>
              <span class="user-name">Alice</span>
            </td>
            <td>
              <span class="user-email">alice@example.com</span>
            </td>
            <td>
              <span class="status active">
                <span class="status-dot"></span>
                Active
              </span>
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

  
  <!-- ===== Added: colour theme picker (new themes). Existing markup unchanged. ===== -->
  <div class="st-dock" id="stDock">
    <div class="st-panel" id="stPanel" role="radiogroup" aria-label="Colour theme">
      <p class="st-title">Theme</p>
      <div class="st-list">
        <button type="button" class="st-opt" role="radio" aria-checked="true" data-st-scheme=""><span class="st-sw" style="background:#4f6bed"></span>Default</button>
        <button type="button" class="st-opt" role="radio" aria-checked="false" data-st-scheme="green"><span class="st-sw" style="background:#1f9d55"></span>Green</button>
        <button type="button" class="st-opt" role="radio" aria-checked="false" data-st-scheme="blue"><span class="st-sw" style="background:#2563eb"></span>Blue</button>
        <button type="button" class="st-opt" role="radio" aria-checked="false" data-st-scheme="sky"><span class="st-sw" style="background:#0ea5e9"></span>Sky Blue</button>
        <button type="button" class="st-opt" role="radio" aria-checked="false" data-st-scheme="darkwhite"><span class="st-sw" style="background:linear-gradient(135deg,#0a0a0a 50%,#ffffff 50%)"></span>Dark + White</button>
        <button type="button" class="st-opt" role="radio" aria-checked="false" data-st-scheme="whitedark"><span class="st-sw" style="background:linear-gradient(135deg,#ffffff 50%,#334155 50%)"></span>White + Dark</button>
      </div>
      <p class="st-hint">Every theme has Light + Dark mode &mdash; switch it with the moon / sun button at the top right.</p>
    </div>
    <button type="button" class="st-btn" id="stBtn" aria-label="Choose colour theme" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.65-.75 1.65-1.69 0-.44-.18-.83-.44-1.12-.29-.29-.44-.65-.44-1.13 0-.92.75-1.66 1.67-1.66h1.99c3.05 0 5.56-2.5 5.56-5.56C21.96 6.01 17.46 2 12 2z"/>
        <circle cx="13.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/>
        <circle cx="17.5" cy="10.5" r="1.2" fill="currentColor" stroke="none"/>
        <circle cx="8.5" cy="7.5" r="1.2" fill="currentColor" stroke="none"/>
        <circle cx="6.5" cy="12.5" r="1.2" fill="currentColor" stroke="none"/>
      </svg>
    </button>
  </div>
<script>

    const root = document.documentElement;
    const toggle = document.getElementById("themeToggle");

    // Theme Management

    function setTheme(theme) {
      root.setAttribute("data-theme", theme);

      try {
        localStorage.setItem("theme", theme);
      } catch (e) {}
    }

    let saved = null;

    try {
      saved = localStorage.getItem("theme");
    } catch (e) {}

    setTheme(
      saved ||
      (window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light")
    );

    toggle.addEventListener("click", () => {
      setTheme(
        root.getAttribute("data-theme") === "dark"
          ? "light"
          : "dark"
      );
    });

  
    /* ===== Added: colour theme picker logic. The existing light/dark theme
       code above is untouched and keeps working exactly as before. ===== */
    (function () {
      var stRoot   = document.documentElement;
      var SCHEMES  = ["", "green", "blue", "sky", "darkwhite", "whitedark"];
      var KEY      = "scheme";
      var dock     = document.getElementById("stDock");
      var stBtn    = document.getElementById("stBtn");
      var options  = Array.prototype.slice.call(dock.querySelectorAll("[data-st-scheme]"));

      function stCurrent() { return stRoot.getAttribute("data-scheme") || ""; }

      function stMark(value) {
        options.forEach(function (o) {
          o.setAttribute("aria-checked", String(o.getAttribute("data-st-scheme") === value));
        });
      }

      function setScheme(scheme) {
        if (scheme) { stRoot.setAttribute("data-scheme", scheme); }
        else { stRoot.removeAttribute("data-scheme"); }
        try {
          if (scheme) { localStorage.setItem(KEY, scheme); }
          else { localStorage.removeItem(KEY); }
        } catch (e) {}
        stMark(scheme);
      }

      options.forEach(function (o) {
        o.addEventListener("click", function () {
          setScheme(o.getAttribute("data-st-scheme"));
        });
      });

      function stClose() {
        dock.classList.remove("open");
        stBtn.setAttribute("aria-expanded", "false");
      }

      stBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var open = dock.classList.toggle("open");
        stBtn.setAttribute("aria-expanded", String(open));
      });

      document.addEventListener("click", function (e) {
        if (!dock.contains(e.target)) { stClose(); }
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && dock.classList.contains("open")) {
          stClose();
          stBtn.focus();
        }
      });

      var stSaved = null;
      try { stSaved = localStorage.getItem(KEY); } catch (e) {}
      if (stSaved && SCHEMES.indexOf(stSaved) !== -1) { setScheme(stSaved); }
      else { stMark(stCurrent()); }
    })();
</script>

</body>
</html>
